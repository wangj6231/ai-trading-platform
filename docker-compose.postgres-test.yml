name: ai-trading-platform-postgres-test

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_trading_test
      POSTGRES_USER: ai_trading_test
      POSTGRES_PASSWORD: local-ephemeral-test-only
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ai_trading_test -d ai_trading_test
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 2s
