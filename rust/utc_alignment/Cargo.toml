[package]
name = "utc-alignment-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "_utc_alignment_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "=0.29.0", features = ["abi3-py312"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
extension-module = ["pyo3/extension-module"]

[profile.release]
panic = "unwind"
overflow-checks = true
